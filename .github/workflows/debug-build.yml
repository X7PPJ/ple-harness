# Builds one dev task's image with plain progress, to surface the real Docker
# error that `eval/run.py` only reports as a failed RUN line.
name: debug-build

on:
  workflow_dispatch:
    inputs:
      task:
        description: "dev task id (folder under tasks/)"
        required: true
        default: "permission-to-operate-memo"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Fetch the task folder
        run: |
          python3 -m pip install --quiet huggingface_hub
          python3 - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          task = os.environ["TASK"]
          path = snapshot_download(
              "google/physical-engineerings-last-exam", repo_type="dataset",
              allow_patterns=[f"tasks/{task}/**"], local_dir="./ple_data",
              max_workers=4, etag_timeout=120)
          print("downloaded", path)
          PY
        env:
          TASK: ${{ inputs.task }}

      - name: Docker build (plain progress)
        run: |
          set -o pipefail
          cd "ple_data/tasks/${{ inputs.task }}"
          ls environment
          sudo docker build --progress=plain -t "debug-${{ inputs.task }}" \
            -f environment/Dockerfile environment 2>&1 | tail -120
