name: ping

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Echo
        run: |
          echo "alive"
          df -h /
          free -h

      - name: Time a clone of the entry repository
        run: |
          set -x
          rm -rf /tmp/entry
          start=$(date +%s)
          git clone --depth 1 https://github.com/X7PPJ/ple-harness /tmp/entry
          echo "shallow clone: $(( $(date +%s) - start ))s"
          rm -rf /tmp/entry2
          start=$(date +%s)
          git clone https://github.com/X7PPJ/ple-harness /tmp/entry2
          echo "full clone: $(( $(date +%s) - start ))s"
          du -sh /tmp/entry2
